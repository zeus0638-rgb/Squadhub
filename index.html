function awardWinnerCounts(awardTypeId, fixtureList){
  const a = DATA.awardTypes.find(x=>x.id===awardTypeId);
  if(!a) return {total:0, byPlayer:[]};
  const counts = {};
  let total = 0;
  (fixtureList || DATA.fixtures).filter(f=>f.status==='finished').forEach(f=>{
    const rec = f.awardRecords && f.awardRecords[awardTypeId];
    let playerId = rec ? rec.playerId : null;
    let given = !!(rec && (rec.playerId || rec.description));
    if(a.legacyMapping==='motm'){
      if(!playerId) playerId = f.motm;
      if(!given) given = !!f.motm;
    }
    if(a.legacyMapping==='moment'){
      if(!playerId) playerId = f.momentPlayer;
      if(!given) given = !!f.moment;
    }
    if(given) total++;
    if(playerId) counts[playerId] = (counts[playerId]||0) + 1;
  });
  const byPlayer = Object.entries(counts)
    .map(([playerId,count])=>({player:getPlayer(playerId), count}))
    .filter(x=>x.player)
    .sort((a,b)=> b.count - a.count);
  return {total, byPlayer};
}
function renderAwardDisplayCard(f, a){
  const rec = (f.awardRecords && f.awardRecords[a.id]) || {};
  let playerId = rec.playerId || null;
  let description = rec.description || '';
  // Fall back to the legacy fields for the two mapped awards, in case this fixture's
  // record was only ever set the old way (e.g. before the new screen existed).
  if(a.legacyMapping==='motm' && !playerId) playerId = f.motm;
  if(a.legacyMapping==='moment'){
    if(!description) description = f.moment;
    if(!playerId) playerId = f.momentPlayer;
  }
  const player = playerId ? getPlayer(playerId) : null;
  if(!player && !description) return '';
  return `
  <div class="card" style="margin-bottom:10px;">
    <div class="section-title" style="margin:0 0 8px;">${esc(a.name)}</div>
    ${player ? `<div style="display:flex; align-items:center; gap:10px; margin-bottom:${description?'8px':'0'};">${shirtHtml(player)}<span style="font-weight:600; font-size:14px; color:var(--ink);">${esc(player.name)}</span></div>` : ''}
    ${description ? `<div style="font-size:14px; color:var(--ink);">${esc(description)}</div>` : ''}
  </div>`;
}
function renderCoachQualsSection(c, showAddButton){
  if(showAddButton === undefined) showAddButton = true;
  const quals = c.quals || [];
  return `
    <div class="row" style="margin-bottom:8px; align-items:center;">
      <div class="section-title" style="margin:0;">Qualifications</div>
      ${showAddButton ? `<button class="btn ghost small" data-add-coach-qual="${c.id}">+ Add</button>` : ''}
    </div>
    <div class="card">
      ${quals.length===0 ? '<div class="small" style="color:var(--ink-soft);">No qualifications recorded</div>' :
        quals.map(link=>{
          const qDef = DATA.qualifications.find(q=>q.id===link.qualificationId);
          const status = qualStatus(link.expiryDate);

}

function openDeleteTeamConfirm(teamId){
  const team = TEAMS_STORE.teams.find(t=>t.id===teamId);
  if(!team) return;
  const teamName = team.name || 'Unnamed team';
  const playerCount = (team.data && team.data.players) ? team.data.players.length : 0;
  const fixtureCount = (team.data && team.data.fixtures) ? team.data.fixtures.length : 0;
  const body = `
    <h3>Delete ${esc(teamName)}?</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="small" style="color:var(--ink-soft); margin-bottom:14px;">
      This permanently deletes ${esc(teamName)} and everything in it — ${playerCount} player${playerCount===1?'':'s'}, ${fixtureCount} fixture${fixtureCount===1?'':'s'}, coaches, results, everything. This can't be undone.
    </div>
    <label>Type <strong>${esc(teamName)}</strong> to confirm</label>
    <input type="text" id="delete-team-confirm-input" placeholder="${esc(teamName)}" autocomplete="off">
    <button class="btn danger" data-confirm-delete-team="${teamId}" disabled style="margin-top:14px;">Delete team</button>
  `;
  openModal(body);
  attachModalHandlers();
  const input = document.getElementById('delete-team-confirm-input');
  const confirmBtn = document.querySelector('[data-confirm-delete-team]');
  if(input && confirmBtn){
    input.addEventListener('input', ()=>{
      confirmBtn.disabled = input.value.trim() !== teamName;
    });
  }
  if(confirmBtn) confirmBtn.addEventListener('click', async ()=>{
    if(input.value.trim() !== teamName) return;
    const ok = await deleteTeamById(teamId);
    if(!ok) return;
    closeModal();
    goHomeOrWizard();
    showSavedToast();
  });
}

      <button type="button" data-auth-toggle-mode style="background:none; border:none; color:#fff; font-weight:700; font-size:13px; text-decoration:underline; cursor:pointer; padding:0 0 0 6px;">${isSignup ? 'Log in' : 'Sign up'}</button>
    </div>
  </div>`;
  const submitBtn = document.querySelector('[data-auth-submit]');
  if(submitBtn) submitBtn.addEventListener('click', handleAuthSubmit);
  const googleBtn = document.querySelector('[data-auth-google]');
  if(googleBtn) googleBtn.addEventListener('click', async ()=>{
    if(!supabaseClient){
      authError = "Couldn't connect to the accounts service. Check your connection and try again.";
      renderAuthGate();
      return;
    }
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href }
    });
    if(error){
      authError = error.message;
      renderAuthGate();
    }
    // On success, Supabase redirects the browser to Google and back - nothing further to do here.
  });
  const emailInput = document.getElementById('auth-email');
  if(emailInput) emailInput.addEventListener('input', ()=>{ authEmailDraft = emailInput.value; });
  document.querySelectorAll('#auth-password, #auth-password-confirm').forEach(el=>{
    el.addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleAuthSubmit(); });
  });
  document.querySelectorAll('[data-toggle-pw]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.togglePw;
      const input = document.getElementById(id);
      const openEye = document.getElementById('eye-open-'+id);
      const closedEye = document.getElementById('eye-closed-'+id);
      const nowShowing = input.type === 'text';
      input.type = nowShowing ? 'password' : 'text';
      if(openEye) openEye.style.display = nowShowing ? '' : 'none';
      if(closedEye) closedEye.style.display = nowShowing ? 'none' : '';
    });
  });
  const switchMode = (mode)=>{
    if(authMode === mode) return;
    authMode = mode;
    authError = '';
    authMessage = '';
    renderAuthGate();
  };
  const toggleBtn = document.querySelector('[data-auth-toggle-mode]');
  if(toggleBtn) toggleBtn.addEventListener('click', ()=> switchMode(isSignup ? 'login' : 'signup'));
  document.querySelectorAll('[data-auth-set-mode]').forEach(btn=>{
    btn.addEventListener('click', ()=> switchMode(btn.dataset.authSetMode));
  });
}
async function handleAuthSubmit(){
  if(authBusy) return;
  const email = (document.getElementById('auth-email').value || '').trim();
  authEmailDraft = email;
  const password = document.getElementById('auth-password').value || '';
  authError = '';
  authMessage = '';
  if(!email || !password){
    authError = 'Please enter both an email and a password.';
    renderAuthGate();
    return;
  }
  if(authMode === 'signup'){
    const confirmEl = document.getElementById('auth-password-confirm');
    const confirmPassword = confirmEl ? (confirmEl.value || '') : '';
    if(password !== confirmPassword){
      authError = "Those passwords don't match. Please check and try again.";
      renderAuthGate();
      return;
    }
  }
  if(!supabaseClient){
    authError = "Couldn't connect to the accounts service. Check your connection and try again.";
    renderAuthGate();
    return;
  }
  authBusy = true;
  renderAuthGate();
  try{
    if(authMode === 'signup'){
      const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { emailRedirectTo: window.location.href } });
      if(error){ authError = error.message; authBusy = false; renderAuthGate(); return; }
      if(data.session){
        currentUser = data.user;
        authBusy = false;
        await loadData();
        await loadTeamsFromCloud();
      } else {
        authBusy = false;
        authMode = 'login';
        authMessage = 'Account created — check your email to confirm it, then log in here.';
        renderAuthGate();
      }
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error){ authError = error.message; authBusy = false; renderAuthGate(); return; }
      currentUser = data.user;
      authBusy = false;
      await loadData();
      await loadTeamsFromCloud();
    }
  }catch(e){
    authError = 'Something went wrong. Please try again.';
    authBusy = false;
    renderAuthGate();
  }
}
async function logOut(){
  if(supabaseClient) await supabaseClient.auth.signOut();
  currentUser = null;
  authMode = 'login';
  authError = '';
  authMessage = '';
  authEmailDraft = '';
  renderAuthGate();
}

  return true;
}

// ---------- backup / restore ----------
async function exportData(){
  const payload = {
    app: 'SquadHub',
    version: APP_VERSION,
    exportedAt: new Date().toISOString(),
    data: DATA
  };
  const jsonStr = JSON.stringify(payload, null, 2);
  const pad = n => n.toString().padStart(2,'0');
  const d = new Date();
  const filename = `squadhub-backup-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;

  // Published Claude artifact pages can't trigger a plain <a download> - that's inert there.
  // Use the platform's downloads capability instead when it's available.
  if(window.claude && typeof window.claude.use === 'function'){
    try{
      const downloads = await window.claude.use('downloads');
      if(downloads){
        try{
          await downloads.save({ filename, data: jsonStr });
        }catch(err){
          if(err && err.code === 'declined'){ /* user said no, nothing to do */ }
          else { alert('Could not save the backup file. Please try again.'); }
        }
        return;
      }
    }catch(e){ /* capability unavailable here - fall through to the direct-download path below */ }
  }

  // Fallback for non-published contexts (e.g. this file opened directly in a browser)
  const blob = new Blob([jsonStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}
function processImportJsonText(jsonText){
  let parsed;
  try{ parsed = JSON.parse(jsonText); }
  catch(e){ alert('That does not look like a valid SquadHub backup — the text could not be read as JSON.'); return; }
  const incoming = parsed && parsed.data ? parsed.data : parsed;
  if(!incoming || !Array.isArray(incoming.players) || !Array.isArray(incoming.fixtures)){
    alert('That does not look like a valid SquadHub backup.');
    return;
  }
  openImportConfirm(incoming);
}
function importDataFromFile(file){
  const reader = new FileReader();
  reader.onload = ()=> processImportJsonText(reader.result);
  reader.onerror = ()=> alert('Could not read that file.');
  reader.readAsText(file);
}
function openPasteImportModal(){
  const body = `
    <h3>Paste backup data</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="small" style="color:var(--ink-soft); margin-bottom:10px;">Open your exported backup file, copy all of its contents, and paste them below.</div>

  `;
  openModal(body);

  if(confirmBtn) confirmBtn.onclick = ()=>{

}
function openImportConfirm(incoming){
  const body = `
    <h3>Import this backup?</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="card" style="margin-bottom:16px;"><div class="small" style="color:var(--ink-soft);">This replaces all current data in the app with the contents of this backup. This cannot be undone.</div></div>
    <button class="btn amber" id="confirm-import-btn" style="width:100%; margin-bottom:10px;">Import &amp; replace data</button>
    <button class="btn ghost" data-close-modal>Cancel</button>
  `;
  openModal(body);
  attachModalHandlers();
  const btn = document.getElementById('confirm-import-btn');
  if(btn) btn.onclick = ()=>{
    if(!incoming.coaches) incoming.coaches = [];
    if(!incoming.qualifications) incoming.qualifications = [];
    incoming.coaches.forEach(c=>{ if(!c.quals) c.quals = []; });
    incoming.fixtures.forEach(f=>{
      normalizeFixtureLineup(f);
      if(!f.coachIds) f.coachIds = [];
    });
    DATA = incoming;
    if(!DATA.themeColor || !THEME_COLORS[DATA.themeColor]) DATA.themeColor = 'red';
    applyTheme();
    saveData();
    closeModal();
    go('team', null, {});
    showSavedToast();
  };
}

function resizeImageFile(file, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        const canvas = document.createElement('canvas');
        canvas.width = maxSize; canvas.height = maxSize;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('Could not load image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function esc(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setupWheelPicker(scrollElId, onChange){
  const el = document.getElementById(scrollElId);
  if(!el) return;
  const items = Array.from(el.querySelectorAll('.wheel-item'));
  function updateSelected(){
    const wrapRect = el.getBoundingClientRect();
    const centerY = wrapRect.top + wrapRect.height/2;
    let closest = null, closestDist = Infinity;
    items.forEach(it=>{
      const r = it.getBoundingClientRect();
      const itemCenter = r.top + r.height/2;
      const dist = Math.abs(itemCenter - centerY);
      if(dist < closestDist){ closestDist = dist; closest = it; }
    });
    items.forEach(it=> it.classList.remove('wheel-selected'));
    if(closest){
      closest.classList.add('wheel-selected');
      el.dataset.selected = closest.dataset.value;
      if(onChange) onChange(closest.dataset.value);
    }
  }
  let scrollTimer = null;
  el.addEventListener('scroll', ()=>{
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(updateSelected, 80);
  }, {passive:true});
  updateSelected();
}

    const [sh, sm] = startTimeVal.split(':').map(Number);

  const a = editing || {id:uid(), name:'', acronym:'', linkedToPlayer:true, hasDescription:false, active:true};
  const body = `
    <h3>${editing ? 'Edit award' : 'New award'}</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <label>Award name</label>
    <input type="text" id="award-type-name" value="${esc(a.name)}" placeholder="e.g. Players' Player, Hustle Award">
    <label>Acronym <span style="font-weight:400; color:var(--ink-soft);">— optional</span></label>
    <input type="text" id="award-type-acronym" value="${esc(a.acronym||'')}" placeholder="e.g. POTM">
    <div class="small" style="color:var(--ink-soft); margin-top:-10px; margin-bottom:16px;">Used instead of the full name in compact spaces, like recent results.</div>
    <label style="display:flex; align-items:center; gap:10px; margin-bottom:16px; cursor:pointer;">
      <input type="checkbox" id="award-type-linked" ${a.linkedToPlayer?'checked':''} style="width:auto; margin:0;">
      <span style="font-weight:600; font-size:14px; color:var(--ink); text-transform:none;">Linked to a player <span style="font-weight:400; color:var(--ink-soft);">— shows as a player dropdown when awarded</span></span>
    </label>
    <label style="display:flex; align-items:center; gap:10px; margin-bottom:16px; cursor:pointer;">
      <input type="checkbox" id="award-type-description" ${a.hasDescription?'checked':''} style="width:auto; margin:0;">
      <span style="font-weight:600; font-size:14px; color:var(--ink); text-transform:none;">Has a description box <span style="font-weight:400; color:var(--ink-soft);">— lets you add notes about it on the post-match screen, like Moment of the Match does</span></span>
    </label>
    <label style="display:flex; align-items:center; gap:10px; margin-bottom:16px; cursor:pointer;">
      <input type="checkbox" id="award-type-active" ${a.active?'checked':''} style="width:auto; margin:0;">
      <span style="font-weight:600; font-size:14px; color:var(--ink); text-transform:none;">Active <span style="font-weight:400; color:var(--ink-soft);">— appears on the post-match screen and in stats</span></span>
    </label>
    <button class="btn amber" data-save-award-type="${a.id}">Save</button>
  `;
  openModal(body);
  attachModalHandlers();
  const saveBtn = document.querySelector('[data-save-award-type]');
  if(saveBtn) saveBtn.onclick = ()=>{
    const name = document.getElementById('award-type-name').value.trim();
    if(!name){ alert('Please enter an award name'); return; }
    const acronym = document.getElementById('award-type-acronym').value.trim();
    const linkedToPlayer = document.getElementById('award-type-linked').checked;
    const hasDescription = document.getElementById('award-type-description').checked;
    const active = document.getElementById('award-type-active').checked;
    let target = DATA.awardTypes.find(x=>x.id===a.id);
    if(!target){ target = {id:a.id}; DATA.awardTypes.push(target); }
    target.name = name;
    target.acronym = acronym;
    target.linkedToPlayer = linkedToPlayer;
    target.hasDescription = hasDescription;
    target.active = active;
    saveData();
    closeModal();
    render();
    showSavedToast();
  };
}
function openRemoveAwardTypeConfirm(awardId){
  const a = DATA.awardTypes.find(x=>x.id===awardId);
  if(!a) return;
  const body = `
    <h3>Remove this award?</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="card" style="margin-bottom:16px;"><div class="small" style="color:var(--ink-soft);">"${esc(a.name)}" will be removed from config, and <strong>all stats and recorded data for it — across every match and player — will be permanently deleted</strong>. This cannot be undone.</div></div>
    <div style="display:flex; gap:10px;">
      <button class="btn ghost" data-close-modal style="flex:1; margin-bottom:0;">Cancel</button>
      <button class="btn danger" data-confirm-remove-award-type="${awardId}" style="flex:1; margin-bottom:0;">Delete everything</button>
    </div>
  `;
  openModal(body);
  attachModalHandlers();
  const confirmBtn = document.querySelector('[data-confirm-remove-award-type]');
  if(confirmBtn) confirmBtn.onclick = ()=>{
    DATA.fixtures.forEach(f=>{
      if(f.awardRecords && f.awardRecords[awardId]) delete f.awardRecords[awardId];
      if(a.legacyMapping==='motm') f.motm = null;
      if(a.legacyMapping==='moment'){ f.moment = ''; f.momentPlayer = null; }
    });
    DATA.awardTypes = DATA.awardTypes.filter(x=>x.id!==awardId);
    saveData();
    closeModal();
    render();
  };
}
function openFixtureShareModal(fixtureId){

    `${esc(teamShort())} vs ${esc(f.opponent||'TBC')}`,
    fmtDate(f.dateTime),
    f.venue ? (f.venue==='home'?'Home':'Away') : null,
    f.competitionType || null,
    f.location || null
  ].filter(Boolean);
  const shareText = lines.join('\n') + (mapsUrl ? `\n${mapsUrl}` : '');
  const body = `
    <h3>Share match details</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="card" style="margin-bottom:16px;">
      <div style="font-weight:700; font-family:'Oswald',sans-serif; font-size:17px; color:var(--ink); margin-bottom:10px;">vs ${esc(f.opponent||'TBC')}</div>

      </div>
      <div class="row" style="padding:7px 0; border-bottom:1px solid var(--line);">

        <div style="font-size:13.5px; font-weight:600; color:var(--ink);">${f.venue ? (f.venue==='home'?'Home':'Away') : '—'}</div>
      </div>
      <div class="row" style="padding:7px 0; ${f.location?'border-bottom:1px solid var(--line);':''}">
        <div class="small" style="color:var(--ink-soft);">Competition</div>
        <div style="font-size:13.5px; font-weight:600; color:var(--ink);">${esc(competitionDisplayLabel(f)||'—')}</div>
      </div>
      ${f.location ? `<div class="row" style="padding:7px 0; align-items:center;">
        <div class="small" style="color:var(--ink-soft);">Location</div>
        <a href="${mapsUrl}" target="_blank" rel="noopener" style="font-size:13.5px; font-weight:600; color:var(--pitch); text-decoration:none; display:flex; align-items:center; gap:4px;">
          ${esc(f.location)}

  attachModalHandlers();

    } else {

  };
}

      const qEvents = sortEventsForDisplay((f.events||[]).filter(ev=>ev.quarter===i+1));

    html += `<div class="card"><div style="font-size:14px;">${names.length>0 ? names.join(', ') : '<span class="small" style="color:var(--ink-soft);">None recorded</span>'}</div></div>`;
  }
  if(sel.h2h && f.opponentId){

      <div class="stat-grid">
        <div class="stat-box"><div class="v" style="color:var(--win);">${h2h.w}</div><div class="l">WINS</div></div>

}
function eventPlainText(ev){
  const time = ev.clockTime ? ev.clockTime : ((typeof ev.minute === 'number') ? `${ev.minute}'` : fmtEventTime(ev.loggedAt));
  if(ev.type==='goal'){
    const scorer = getPlayer(ev.scorer);
    const assist = ev.assist ? getPlayer(ev.assist) : null;
    return `${scorer?scorer.name:'Unknown'} scores${assist?', assist by '+assist.name:''}${time?' ('+time+')':''}`;
  } else if(ev.type==='oppogoal'){
    return `Opponent scores${time?' ('+time+')':''}`;
  } else if(ev.type==='sub'){
    const out = getPlayer(ev.out), inn = getPlayer(ev.in);
    return `${inn?inn.name:'?'} on for ${out?out.name:'?'}${time?' ('+time+')':''}`;
  } else if(ev.type==='penalty'){
    const p = getPlayer(ev.player);
    return `${p?p.name:'?'} penalty — ${ev.outcome}${time?' ('+time+')':''}`;
  } else if(ev.type==='comment'){
    return ev.text;
  } else if(ev.type==='yellowcard'){
    const p = getPlayer(ev.player);
    return `${p?p.name:'?'} — yellow card${time?' ('+time+')':''}`;
  } else if(ev.type==='redcard'){
    const p = getPlayer(ev.player);
    return `${p?p.name:'?'} — red card${time?' ('+time+')':''}`;
  }
  return ev.type;
}
function resultShareText(f, sel){
  const res = fixtureResultLabel(f);
  const stats = teamMatchStats(f);
  const lines = [
    `${esc(teamShort())} ${f.finalScore.us} - ${f.finalScore.them} ${f.opponent||'TBC'} (${res.toUpperCase()})`,
    fmtDate(f.dateTime),
    periodKeys(f).map((q,i)=>`Q${i+1} ${stats.goalsByQuarter[i+1]}-${stats.oppoGoalsByQuarter[i+1]}`).join(' · ')
  ];
  if(sel.summary && f.matchSummary){
    lines.push('', 'Match summary:', f.matchSummary);
  }
  if(sel.timeline){
    lines.push('', 'Timeline:');
    periodKeys(f).forEach((q,i)=>{
      const qEvents = sortEventsForDisplay((f.events||[]).filter(ev=>ev.quarter===i+1));
      if(qEvents.length===0){
        lines.push(`Q${i+1}: No action!`);
      } else {
        qEvents.forEach(ev=>{
          lines.push(`Q${i+1}: ${eventPlainText(ev)}`);
        });
      }
    });
  }
  if(sel.awards){
    DATA.awardTypes.filter(a=>a.active).forEach(a=>{
      const rec = f.awardRecords && f.awardRecords[a.id];
      let pid = rec ? rec.playerId : null;
      if(!pid && a.legacyMapping==='motm') pid = f.motm;
      if(!pid && a.legacyMapping==='moment') pid = f.momentPlayer;
      const player = pid ? getPlayer(pid) : null;
      if(player) lines.push(`${a.name}: ${player.name}`);
    });
  }
  if(sel.referee && f.referee){
    lines.push('', `Referee: ${f.referee}`);
  }
  if(sel.coaches && f.coachIds && f.coachIds.length){
    const names = f.coachIds.map(id=>{ const c=DATA.coaches.find(x=>x.id===id); return c?c.name:null; }).filter(Boolean);
    if(names.length>0) lines.push('', `Coaches present: ${names.join(', ')}`);
  }
  if(sel.h2h && f.opponentId){
    const h2h = opponentStats(f.opponentId);
    lines.push('', `Head-to-head vs ${f.opponent}: ${h2h.w}W ${h2h.d}D ${h2h.l}L (${h2h.played} played)`);
  }
  return lines.join('\n');
}

function openRemoveSavedOppOrLocConfirm(kind, id){
  const list = kind==='opponent' ? DATA.opponents : DATA.locations;
  const item = list.find(x=>x.id===id);
  if(!item) return;
  const body = `
    <h3>Remove "${esc(item.name)}"?</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="small" style="color:var(--ink-soft); margin-bottom:16px;">It won't suggest this ${kind} anymore. Existing fixtures that already used it are unaffected.</div>
    <div style="display:flex; gap:10px;">
      <button class="btn ghost" data-close-modal style="flex:1; margin-bottom:0;">Cancel</button>
      <button class="btn danger" data-confirm-remove-saved="${kind}|${id}" style="flex:1; margin-bottom:0;">Remove</button>
    </div>
  `;
  openModal(body);
  attachModalHandlers();
  const confirmBtn = document.querySelector('[data-confirm-remove-saved]');
  if(confirmBtn) confirmBtn.onclick = ()=>{
    if(kind==='opponent') DATA.opponents = DATA.opponents.filter(x=>x.id!==id);
    else DATA.locations = DATA.locations.filter(x=>x.id!==id);
    saveData();
    openManageOppLocModal();
  };
}
function openRemoveQualConfirm(qualId){
  const q = DATA.qualifications.find(x=>x.id===qualId);
  if(!q) return;
  const affected = DATA.coaches.filter(c=> (c.quals||[]).some(link=>link.qualificationId===qualId)).length;
  const body = `
    <h3>Remove this qualification?</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="card" style="margin-bottom:16px;"><div class="small" style="color:var(--ink-soft);">"${esc(q.name)}" will be removed from the library${affected>0 ? ` and from ${affected} coach${affected===1?'':'es'} who ${affected===1?'has':'have'} it recorded` : ''}. This cannot be undone.</div></div>
    <div style="display:flex; gap:10px;">
      <button class="btn ghost" data-close-modal style="flex:1; margin-bottom:0;">Cancel</button>
      <button class="btn danger" data-confirm-remove-qual="${qualId}" style="flex:1; margin-bottom:0;">Remove</button>
    </div>
  `;
  openModal(body);
  attachModalHandlers();
  const confirmBtn = document.querySelector('[data-confirm-remove-qual]');
  if(confirmBtn) confirmBtn.onclick = ()=>{
    DATA.qualifications = DATA.qualifications.filter(x=>x.id!==qualId);
    DATA.coaches.forEach(c=>{ if(c.quals) c.quals = c.quals.filter(link=>link.qualificationId!==qualId); });
    saveData();
    closeModal();
    render();
  };
}

function openSpreadMinutesModal(fixtureId){
  const f = getEditingFixture(fixtureId);
  if(!f) return;
  const squad = sortByName(DATA.players.filter(p=>f.squadIds.includes(p.id)));
  if(squad.length===0){
    openModal(`<h3>Spread minutes evenly</h3><button class="icon-x" data-close-modal>&times;</button><div class="small" style="color:var(--ink-soft);">Select your squad for this match first.</div>`);
    attachModalHandlers();
    return;
  }
  const posGroups = outfieldPositionGroups(f);
  const pillStyle = (on)=> `padding:6px 11px; border-radius:14px; border:1.5px solid var(--pitch); background:${on?'var(--pitch)':'none'}; color:${on?'#fff':'var(--ink)'}; font-size:11.5px; font-weight:600; cursor:pointer; margin:0 6px 6px 0;`;
  const totalMatchMinutes = (f.periods || DEFAULT_CONFIG.periods) * (f.minutesPerPeriod || DEFAULT_CONFIG.minutesPerPeriod);
  const maxMinuteOptions = [];
  for(let m=5; m<Math.ceil(totalMatchMinutes/5)*5; m+=5) maxMinuteOptions.push(m);
  const body = `
    <h3>Auto-generate</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="small" style="color:var(--ink-soft); margin-bottom:14px; font-size:14px;">This replaces your current teamsheet for every quarter. Tap a player to include or exclude them, pick which positions they can be spread across, and cap their minutes if needed.</div>
    <label>Rotate goalkeepers?</label>
    <select id="spread-gk" style="background:none; border:1px solid var(--line); color:var(--ink-soft); font-size:13px;">
      <optgroup label="Rotate GKs?">
        <option value="">Yes</option>
      </optgroup>
      <optgroup label="or select your fixed GK">
        ${squad.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
      </optgroup>
    </select>
    <label>Minimise subs <span style="font-weight:400; color:var(--ink-soft); text-transform:none;">— fewer subs across periods and the match, at the cost of slightly less even minutes</span></label>
    <div class="toggle-group" id="spread-minimize-subs" data-selected="no" style="margin-bottom:16px;">
      <button type="button" data-minsubs-opt="no" class="on">No</button>
      <button type="button" data-minsubs-opt="yes">Yes</button>
    </div>
    <label>Players to include</label>
    <div style="max-height:380px; overflow-y:auto; margin-bottom:16px;">
      ${squad.map(p=>{
        const preferredKeys = new Set((p.positions||[]).map(pp=>positionGroupKey(pp)));
        return `
        <div class="card tap" data-spread-player="${p.id}" data-included="true" style="margin-bottom:8px; padding:10px 12px; cursor:pointer; background:color-mix(in srgb, var(--win) 18%, transparent);">
          <div style="display:flex; align-items:center; gap:10px; font-weight:500; color:var(--ink); margin-bottom:8px;">
            ${shirtHtml(p,'width:26px;height:26px;font-size:11px;')}
            <span style="flex:1;">${esc(p.name)}</span>
            <svg data-spread-check viewBox="0 0 24 24" width="18" height="18" fill="none" style="flex-shrink:0;"><path d="M5 13l4 4L19 7" stroke="var(--win)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div style="padding-left:2px; margin-bottom:8px;" onclick="event.stopPropagation()">
            ${posGroups.map(pg=>`<button type="button" data-spread-pos="${p.id}|${pg.key}" style="${pillStyle(preferredKeys.has(pg.key))}">${pg.label}</button>`).join('')}
          </div>
          <div style="display:flex; align-items:center; gap:7px;" onclick="event.stopPropagation()">
            <span class="small" style="color:var(--ink-soft);">Max minutes</span>
            <select data-spread-max="${p.id}" style="width:auto; padding:5px 8px; font-size:13px; margin:0;">
              <option value="max">Max</option>
              ${maxMinuteOptions.map(m=>`<option value="${m}">${m}'</option>`).join('')}
            </select>
          </div>
        </div>`;
      }).join('')}
    </div>
    <button class="btn amber" data-spread-auto="${fixtureId}" style="margin-bottom:0;">Auto-generate</button>
  `;
  openModal(body);
  attachModalHandlers();
  document.querySelectorAll('[data-spread-player]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const included = row.dataset.included === 'true';
      row.dataset.included = included ? 'false' : 'true';
      row.style.background = included ? 'none' : 'color-mix(in srgb, var(--win) 18%, transparent)';
      const check = row.querySelector('[data-spread-check]');
      if(check) check.style.display = included ? 'none' : '';
    });
  });
  document.querySelectorAll('[data-spread-pos]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const isOn = btn.style.background !== 'none' && btn.style.background !== '';
      btn.setAttribute('style', pillStyle(!isOn));
    });
  });
  document.querySelectorAll('[data-minsubs-opt]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const grp = document.getElementById('spread-minimize-subs');
      grp.dataset.selected = btn.dataset.minsubsOpt;
      grp.querySelectorAll('[data-minsubs-opt]').forEach(b=> b.classList.toggle('on', b.dataset.minsubsOpt===btn.dataset.minsubsOpt));
    });
  });
  const readSpreadSelections = ()=>{
    const gkSel = document.getElementById('spread-gk');
    const fixedGkId = gkSel && gkSel.value ? gkSel.value : null;
    const selectedIds = Array.from(document.querySelectorAll('[data-spread-player]'))
      .filter(el=>el.dataset.included === 'true')
      .map(el=>el.dataset.spreadPlayer);
    if(fixedGkId && !selectedIds.includes(fixedGkId)) selectedIds.push(fixedGkId);
    if(selectedIds.length===0){
      alert('Select at least one player.');
      return null;
    }
    const eligiblePositionsByPlayer = {};
    const maxMinutesByPlayer = {};
    selectedIds.forEach(pid=>{
      eligiblePositionsByPlayer[pid] = Array.from(document.querySelectorAll(`[data-spread-pos^="${pid}|"]`))
        .filter(btn=> btn.style.background !== 'none' && btn.style.background !== '')
        .map(btn=> btn.dataset.spreadPos.split('|')[1]);
      const maxSel = document.querySelector(`[data-spread-max="${pid}"]`);
      maxMinutesByPlayer[pid] = (maxSel && maxSel.value !== 'max') ? parseInt(maxSel.value) : null;
    });
    const minimizeSubs = document.getElementById('spread-minimize-subs').dataset.selected === 'yes';
    return { fixedGkId, selectedIds, eligiblePositionsByPlayer, maxMinutesByPlayer, minimizeSubs };
  };
  const autoBtn = document.querySelector('[data-spread-auto]');
  if(autoBtn) autoBtn.onclick = ()=>{
    const sel = readSpreadSelections();
    if(!sel) return;
    openAutoGenerateFixChoice(fixtureId, sel);
  };
}
function openAutoGenerateFixChoice(fixtureId, sel){
  const body = `
    <h3>Fix any players first?</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="small" style="color:var(--ink-soft); margin-bottom:18px;">You can lock specific players into specific quarters and positions yourself before the rest is auto-generated around them — or just let auto-generate handle the whole teamsheet.</div>
    <div style="display:flex; gap:10px;">
      <button class="btn ghost" data-fix-choice="no" style="flex:1; margin-bottom:0;">No, auto-generate all</button>
      <button class="btn amber" data-fix-choice="yes" style="flex:1; margin-bottom:0;">Yes, let me fix some</button>
    </div>
  `;
  openModal(body);
  attachModalHandlers();
  document.querySelectorAll('[data-fix-choice]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.fixChoice === 'yes'){
        closeModal();
        openFullLineupGridModal(fixtureId, sel.selectedIds, sel.fixedGkId, sel.eligiblePositionsByPlayer, sel.minimizeSubs, sel.maxMinutesByPlayer);
      } else {
        const fLive = getEditingFixture(fixtureId);
        lastSpreadParams[fixtureId] = { selectedIds:sel.selectedIds, fixedGkId:sel.fixedGkId, eligiblePositionsByPlayer:sel.eligiblePositionsByPlayer, maxMinutesByPlayer:sel.maxMinutesByPlayer, minimizeSubs:sel.minimizeSubs, presetLineup: {} };
        fLive.lineup = generateEvenMinutesLineup(fLive, sel.selectedIds, sel.fixedGkId, sel.eligiblePositionsByPlayer, sel.minimizeSubs, false, {}, sel.maxMinutesByPlayer);
        saveData();
        closeModal();
        render();
      }
    });
  });
}
function openFullLineupGridModal(fixtureId, selectedIds, fixedGkId, eligiblePositionsByPlayer, minimizeSubs, maxMinutesByPlayer){
  const f = getEditingFixture(fixtureId);
  if(!f) return;
  const players = sortByName(DATA.players.filter(p=>selectedIds.includes(p.id)));
  const periods = periodKeys(f);
  const positionsToPick = f.positions.filter(pos=> !(pos==='GK' && fixedGkId));
  const body = `
    <h3>Fix players</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="small" style="color:var(--ink-soft); margin-bottom:14px;">Fill in as many cells as you like — whatever you leave as "-" will be auto-generated around whoever you've fixed, taking their minutes and positions into account.</div>
    ${fixedGkId ? `<div class="small" style="color:var(--ink-soft); margin-bottom:10px;">GK: ${esc((getPlayer(fixedGkId)||{}).name || 'Fixed goalkeeper')} (fixed every period)</div>` : ''}
    ${periods.map((q,i)=>`
      <div class="section-title" style="${i===0?'margin-top:0;':''}">${esc(periodBadgeLabel(f, i+1))}</div>
      ${positionsToPick.map(pos=>`
        <label>${esc(pos)}</label>
        <select data-grid-pos="${q}|${pos}">
          <option value="">-</option>
          ${players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
        </select>`).join('')}
    `).join('')}
    <button class="btn amber" data-confirm-grid-lineup="${fixtureId}" style="margin-top:8px;">Generate the rest</button>
    <div style="height:10px;"></div>
    <button class="btn ghost" data-back-to-spread-select="${fixtureId}">Back</button>
  `;
  openModal(body);
  attachModalHandlers();
  const backBtn = document.querySelector('[data-back-to-spread-select]');
  if(backBtn) backBtn.onclick = ()=>{ closeModal(); openSpreadMinutesModal(fixtureId); };
  const confirmBtn = document.querySelector('[data-confirm-grid-lineup]');
  if(confirmBtn) confirmBtn.onclick = ()=>{
    const presetLineup = {};
    periods.forEach(q=>{ presetLineup[q] = {}; });
    let hasDuplicate = false;
    periods.forEach(q=>{
      const picksThisPeriod = Array.from(document.querySelectorAll(`[data-grid-pos^="${q}|"]`))
        .map(sel=>({pos:sel.dataset.gridPos.split('|')[1], val:sel.value}))
        .filter(p=>p.val);
      const chosenIds = picksThisPeriod.map(p=>p.val);
      if(chosenIds.some((id,i)=> chosenIds.indexOf(id)!==i)) hasDuplicate = true;
      picksThisPeriod.forEach(p=>{ presetLineup[q][p.pos] = p.val; });
    });
    if(hasDuplicate){
      alert('The same player is picked for more than one position in the same quarter — please fix that before continuing.');
      return;
    }
    const fLive = getEditingFixture(fixtureId);
    lastSpreadParams[fixtureId] = { selectedIds, fixedGkId, eligiblePositionsByPlayer, maxMinutesByPlayer, minimizeSubs, presetLineup };
    fLive.lineup = generateEvenMinutesLineup(fLive, selectedIds, fixedGkId, eligiblePositionsByPlayer, minimizeSubs, false, presetLineup, maxMinutesByPlayer);
    saveData();
    closeModal();
    render();
  };
}

function openDeleteEventConfirm(fixtureId, eventId){
  const f = DATA.fixtures.find(x=>x.id===fixtureId);
  if(!f) return;
  const ev = (f.events||[]).find(x=>x.id===eventId);
  if(!ev) return;
  const body = `
    <h3>Delete this event?</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="card" style="margin-bottom:16px;">${renderEventItem(ev, null)}</div>
    <button class="btn danger" data-confirm-delete-event="${fixtureId}|${eventId}" style="width:100%; margin-bottom:10px;">Delete event</button>
    <button class="btn ghost" data-close-modal>Cancel</button>
  `;
  openModal(body);
  attachModalHandlers();
  const confirmBtn = document.querySelector('[data-confirm-delete-event]');
  if(confirmBtn) confirmBtn.onclick = ()=>{
    const f2 = DATA.fixtures.find(x=>x.id===fixtureId);
    if(!f2) { closeModal(); return; }
    const ev2 = (f2.events||[]).find(x=>x.id===eventId);
    if(!ev2) { closeModal(); return; }
    f2.events = f2.events.filter(x=>x.id!==eventId);
    if(ev2.type==='goal'){
      f2.finalScore.us = Math.max(0, f2.finalScore.us - 1);
    } else if(ev2.type==='penalty' && ev2.outcome==='Scored'){
      f2.finalScore.us = Math.max(0, f2.finalScore.us - 1);
    } else if(ev2.type==='oppogoal'){
      f2.finalScore.them = Math.max(0, f2.finalScore.them - 1);
    }
    saveData();
    closeModal();
    render();
  };
}
function openOppoGoalMinuteStep(fixtureId){
  const f = DATA.fixtures.find(x=>x.id===fixtureId);
  if(!f) return;
  const mpp = f.minutesPerPeriod || DEFAULT_CONFIG.minutesPerPeriod;
  const q = currentEventQuarter(f);

function openEventModal(fixtureId, type){
  const f = DATA.fixtures.find(x=>x.id===fixtureId);
  const squad = sortByName(DATA.players.filter(p=>f.squadIds.includes(p.id)));
  let body = '';
  if(type==='penalty'){
    body = `<h3>Penalty</h3>
      <button class="icon-x" data-close-modal>&times;</button>
      <label>Taker</label>
      <select id="ev-pen-player"><option value="">Select player</option>${squad.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
      <label>Outcome</label>
      <div class="toggle-group" id="ev-pen-outcome" data-selected="Scored">
        <button type="button" class="pen-toggle on" data-out="Scored">Scored</button>
        <button type="button" class="pen-toggle" data-out="Missed">Missed</button>
      </div>
      <button class="btn amber" data-confirm-penalty="${fixtureId}">Add penalty</button>`;
  } else if(type==='comment'){
    body = `<h3>Quarter note</h3>
      <button class="icon-x" data-close-modal>&times;</button>
      <label>Note for Q${f.liveState.quarter}</label>
      <textarea id="ev-comment" placeholder="e.g. Pressed well, lost shape late">${esc(f.quarterComments['q'+currentEventQuarter(f)]||'')}</textarea>
      <button class="btn amber" data-confirm-comment="${fixtureId}">Save note</button>`;
  }
  openModal(body);
  attachModalHandlers();
  if(type==='penalty'){
    document.querySelectorAll('.pen-toggle').forEach(b=>{
      b.addEventListener('click', ()=>{
        document.querySelectorAll('.pen-toggle').forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
        document.getElementById('ev-pen-outcome').dataset.selected = b.dataset.out;
      });
    });
  }
}

function openQuarterConfirmModal(fixtureId){
  const f = DATA.fixtures.find(x=>x.id===fixtureId);
  const q = f.liveState.quarter;
  const usGoalsThisQuarter = (f.events||[]).filter(ev=>ev.type==='goal' && ev.quarter===q).length;
  const usGoalsTotal = (f.events||[]).filter(ev=>ev.type==='goal').length;
  const themGoalsThisQuarter = (f.events||[]).filter(ev=>ev.type==='oppogoal' && ev.quarter===q).length;
  const themGoalsTotal = (f.events||[]).filter(ev=>ev.type==='oppogoal').length;
  const qSummary = quarterPlayerSummary(f, q);
  const body = `
    <h3>Confirm score — end of Q${q}</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="small" style="color:var(--ink-soft); margin-bottom:14px;">
      ${usGoalsThisQuarter} for us and ${themGoalsThisQuarter} for the opponent logged in Q${q}. Totals below are summed from logged goals — check and adjust before moving on.
    </div>
    <div class="field-row">
      <div><label>Us</label><input type="number" min="0" id="qc-us" value="${usGoalsTotal}"></div>
      <div><label>Them</label><input type="number" min="0" id="qc-them" value="${themGoalsTotal}"></div>
    </div>
    <div class="section-title" style="margin-top:4px;">Q${q} summary</div>
    <div class="card" style="margin-bottom:16px;">
      ${qSummary.length===0 ? '<div class="small" style="color:var(--ink-soft);">No minutes recorded for this quarter</div>' :
        qSummary.map(s=>{
          const p = getPlayer(s.playerId);
          if(!p) return '';
          const badges = [];
          if(s.goals) badges.push(`${s.goals}\u26bd`);
          if(s.assists) badges.push(`${s.assists}\ud83c\udd70\ufe0f`);
          return `<div class="player-row">
            ${shirtHtml(p, 'width:28px;height:28px;font-size:11px;')}
            <div style="flex:1;">
              <div class="pname">${esc(p.name)}</div>
              ${badges.length ? `<div class="ppos">${badges.join(' · ')}</div>` : ''}
            </div>
            <div class="num" style="font-size:15px;">${s.minutes}'</div>
          </div>`;
        }).join('')}
    </div>
    <button class="btn amber" data-confirm-quarter="${fixtureId}">Confirm &amp; start Q${Math.min(f.periods, q+1)}</button>
  `;
  openModal(body);
  attachModalHandlers();
  const confirmBtn = document.querySelector('[data-confirm-quarter]');
  if(confirmBtn) confirmBtn.onclick = ()=>{
    f.finalScore.us = parseInt(document.getElementById('qc-us').value)||0;
    f.finalScore.them = parseInt(document.getElementById('qc-them').value)||0;
    f.liveState.quarter = Math.min(f.periods, f.liveState.quarter+1);
    f.liveState.secondsLeft = f.minutesPerPeriod * 60;
    f.liveState.running = false;
    liveViewingQuarter = null;
    stopTimer();
    saveData();
    closeModal();
    render();
    showPeriodAnimation(f);
  };
}

function openDynamicAwardsModal(fixtureId, isEndOfMatch){
  const f = DATA.fixtures.find(x=>x.id===fixtureId);
  if(!f) return;
  if(!f.awardRecords) f.awardRecords = {};
  const squad = sortByName(DATA.players.filter(p=>f.squadIds.includes(p.id) && computeActualMinutes(f,p.id)>0));
  const activeAwards = DATA.awardTypes.filter(a=>a.active);
  const body = `
    <h3>Match awards</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="small" style="color:var(--ink-soft); margin-bottom:16px;">
      Generated from your Awards config in My Team.
    </div>
    ${activeAwards.length===0 ? `<div class="card"><div class="small" style="color:var(--ink-soft);">No active awards configured. Add some in Settings &rarr; Awards.</div></div>` : activeAwards.map(a=>{
      const rec = f.awardRecords[a.id] || {};
      return `
      <div class="card" style="margin-bottom:10px;">
        <div style="font-weight:700; font-family:'Oswald',sans-serif; font-size:14.5px; color:var(--ink); margin-bottom:8px;">${esc(a.name)}</div>
        ${a.linkedToPlayer ? `
          <select data-dyn-award-player="${a.id}">
            <option value="">Select player</option>
            ${squad.map(p=>`<option value="${p.id}" ${rec.playerId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
          </select>` : ''}
        ${a.hasDescription ? `<textarea data-dyn-award-desc="${a.id}" placeholder="Description / comments">${esc(rec.description||'')}</textarea>` : ''}
        ${!a.linkedToPlayer && !a.hasDescription ? `<div class="small" style="color:var(--ink-soft);">No player or description configured for this award — nothing to record.</div>` : ''}
      </div>`;
    }).join('')}
    <button class="btn amber" data-save-dynamic-awards="${fixtureId}">${activeAwards.length===0 ? 'Close' : 'Save'}</button>
  `;
  openModal(body);
  attachModalHandlers();
  const saveBtn = document.querySelector('[data-save-dynamic-awards]');
  if(saveBtn) saveBtn.onclick = ()=>{
    activeAwards.forEach(a=>{
      const rec = f.awardRecords[a.id] || {};
      if(a.linkedToPlayer){
        const sel = document.querySelector(`[data-dyn-award-player="${a.id}"]`);
        rec.playerId = sel && sel.value ? sel.value : null;
      }
      if(a.hasDescription){
        const ta = document.querySelector(`[data-dyn-award-desc="${a.id}"]`);
        rec.description = ta ? ta.value : '';
      }
      f.awardRecords[a.id] = rec;
      // Linked by id (not name) so this still works even if the award gets renamed later.
      if(a.legacyMapping==='motm'){
        f.motm = rec.playerId || null;
      } else if(a.legacyMapping==='moment'){
        f.moment = rec.description || '';
        f.momentPlayer = rec.playerId || null;
      }
    });
    saveData();
    showSavedToast();
    if(isEndOfMatch){
      openMatchSummaryPrompt(fixtureId);
    } else {
      closeModal();
      render();
    }
  };
}
function openMatchSummaryPrompt(fixtureId){
  const body = `
    <h3>Write a match summary?</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <div class="small" style="color:var(--ink-soft); margin-bottom:16px;">Add a short write-up of how the match went — shown on the match report.</div>
    <div style="display:flex; gap:10px;">
      <button class="btn ghost" data-summary-no="${fixtureId}" style="flex:1; margin-bottom:0;">No</button>
      <button class="btn amber" data-summary-yes="${fixtureId}" style="flex:1; margin-bottom:0;">Yes</button>
    </div>
  `;
  openModal(body);
  attachModalHandlers();
  const noBtn = document.querySelector('[data-summary-no]');
  if(noBtn) noBtn.onclick = ()=>{ closeModal(); render(); };
  const yesBtn = document.querySelector('[data-summary-yes]');
  if(yesBtn) yesBtn.onclick = ()=> openMatchSummaryEditor(fixtureId);
}
function openMatchSummaryEditor(fixtureId){
  const f = DATA.fixtures.find(x=>x.id===fixtureId);
  if(!f) return;
  const body = `
    <h3>Match summary</h3>
    <button class="icon-x" data-close-modal>&times;</button>
    <textarea id="match-summary-text" maxlength="1000" placeholder="How did the match go?" style="min-height:120px;">${esc(f.matchSummary||'')}</textarea>
    <div class="small" style="color:var(--ink-soft); text-align:right; margin-top:-10px; margin-bottom:14px;"><span id="summary-char-count">${(f.matchSummary||'').length}</span>/1000</div>
    <button class="btn amber" data-save-match-summary="${fixtureId}">Save summary</button>
  `;
  openModal(body);
  attachModalHandlers();
  const ta = document.getElementById('match-summary-text');
  const counter = document.getElementById('summary-char-count');
  if(ta && counter) ta.addEventListener('input', ()=>{ counter.textContent = ta.value.length; });
  const saveBtn = document.querySelector('[data-save-match-summary]');
  if(saveBtn) saveBtn.onclick = ()=>{
    const f2 = DATA.fixtures.find(x=>x.id===fixtureId);
    if(f2) f2.matchSummary = ta ? ta.value.slice(0,1000) : '';
    saveData();
    closeModal();
    render();
    showSavedToast();
  };
}
// ---------- event handlers ----------
function attachHandlers(){
  document.querySelectorAll('[data-coach-qualify-filter]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      coachQualifyFilter = btn.dataset.coachQualifyFilter;
      render();
    });

  });

    el.addEventListener('click', ()=>{
      if(el.dataset.navTab === 'matchday'){ goToMatchday(); return; }
      if(el.dataset.navTab === 'results'){ resultsReturnTo = null; resultsFilter = null; }
      go(el.dataset.navTab, null, {});
    });
  });
  const newFix = document.querySelector('[data-new-fixture]');
  if(newFix) newFix.addEventListener('click', ()=>{
    pendingNewFixture = emptyFixture();
    go('fixtures','fixtureEditor',{id:pendingNewFixture.id});
  });
  const newP = document.querySelector('[data-new-player]');
  if(newP) newP.addEventListener('click', ()=> go('players','playerEditor',{}));

  document.querySelectorAll('[data-open-fixture]').forEach(el=>{
    el.addEventListener('click', ()=> go(VIEW.tab,'fixtureEditor',{id:el.dataset.openFixture}));
  });
  document.querySelectorAll('[data-open-result]').forEach(el=>{
    el.addEventListener('click', ()=> go(VIEW.tab,'resultDetail',{id:el.dataset.openResult}));
  });
  document.querySelectorAll('[data-view-result]').forEach(el=>{
    el.addEventListener('click', ()=> go(VIEW.tab,'resultDetail',{id:el.dataset.viewResult}));
  });
  document.querySelectorAll('[data-open-player]').forEach(el=>{
    el.addEventListener('click', ()=> go(VIEW.tab,'playerProfile',{id:el.dataset.openPlayer}));
  });
  document.querySelectorAll('[data-open-player-edit]').forEach(el=>{
    el.addEventListener('click', ()=> go(VIEW.tab,'playerEditor',{id:el.dataset.openPlayerEdit}));
  });

  const back = document.querySelector('[data-back]');
  if(back && !back.dataset.navTab) back.addEventListener('click', ()=> go(VIEW.tab,null,{}));

  document.querySelectorAll('[data-back-to-fixture]').forEach(el=>{
    el.addEventListener('click', ()=>{ stopTimer(); go(VIEW.tab,'fixtureEditor',{id:el.dataset.backToFixture}); });
  });

  // fixture editor
  const oppInput = document.getElementById('f-opponent');
  const oppSuggest = document.getElementById('opponent-suggestions');
  if(oppInput && oppSuggest){
    const renderOppSuggestions = ()=>{
      const q = oppInput.value.trim();
      let matches;
      if(!q){
        matches = [...DATA.opponents].sort((a,b)=>a.name.localeCompare(b.name)).slice(0,8);
      } else {
        matches = DATA.opponents
          .map(o=>({o, score:fuzzyMatchScore(q, o.name)}))
          .filter(x=>x.score>=0)
          .sort((a,b)=>b.score-a.score)
          .slice(0,8)
          .map(x=>x.o);
      }
      if(matches.length===0){ oppSuggest.style.display='none'; oppSuggest.innerHTML=''; return; }
      oppSuggest.innerHTML = matches.map(o=>{
        const played = DATA.fixtures.filter(fx=>fx.opponentId===o.id && fx.status==='finished').length;
        return `<div class="opp-suggest-row" data-pick-opponent-name="${esc(o.name)}" style="padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--line); font-size:14px;">${esc(o.name)}${played?` <span style="color:var(--ink-soft); font-size:12px;">· ${played} played</span>`:''}</div>`;
      }).join('');
      oppSuggest.style.display = 'block';
      oppSuggest.querySelectorAll('[data-pick-opponent-name]').forEach(row=>{
        row.addEventListener('mousedown', e=> e.preventDefault());
        row.addEventListener('click', ()=>{
          oppInput.value = row.dataset.pickOpponentName;
          oppSuggest.style.display = 'none';
        });
      });
    };
    oppInput.addEventListener('input', renderOppSuggestions);
    oppInput.addEventListener('focus', renderOppSuggestions);
    oppInput.addEventListener('blur', ()=>{ setTimeout(()=>{ oppSuggest.style.display = 'none'; }, 150); });
  }
  const locInput = document.getElementById('f-location');
  const locSuggest = document.getElementById('location-suggestions');
  if(locInput && locSuggest){
    const renderLocSuggestions = ()=>{
      const q = locInput.value.trim();
      let matches;
      if(!q){
        matches = [...DATA.locations].sort((a,b)=>a.name.localeCompare(b.name)).slice(0,8);
      } else {
        matches = DATA.locations
          .map(l=>({l, score:fuzzyMatchScore(q, l.name)}))
          .filter(x=>x.score>=0)
          .sort((a,b)=>b.score-a.score)
          .slice(0,8)
          .map(x=>x.l);
      }
      if(matches.length===0){ locSuggest.style.display='none'; locSuggest.innerHTML=''; return; }
      locSuggest.innerHTML = matches.map(l=>`<div class="opp-suggest-row" data-pick-location-name="${esc(l.name)}" style="padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--line); font-size:14px;">${esc(l.name)}</div>`).join('');
      locSuggest.style.display = 'block';
      locSuggest.querySelectorAll('[data-pick-location-name]').forEach(row=>{
        row.addEventListener('mousedown', e=> e.preventDefault());
        row.addEventListener('click', ()=>{
          locInput.value = row.dataset.pickLocationName;
          locSuggest.style.display = 'none';
          locInput.dispatchEvent(new Event('change'));
        });
      });
    };
    locInput.addEventListener('input', renderLocSuggestions);
    locInput.addEventListener('focus', renderLocSuggestions);
    locInput.addEventListener('blur', ()=>{ setTimeout(()=>{ locSuggest.style.display = 'none'; }, 150); });
  }
  function saveMatchDetailField(fn){
    const f = getEditingFixture(VIEW.params.id);
    if(!f) return;
    fn(f);
    saveData();
  }
  const fOpponent = document.getElementById('f-opponent');
  if(fOpponent) fOpponent.addEventListener('change', ()=>{
    saveMatchDetailField(f=>{
      f.opponent = fOpponent.value;
      const opp = findOrCreateOpponent(f.opponent);
      f.opponentId = opp ? opp.id : null;
    });
    render();
  });
  const fDate = document.getElementById('f-date');
  const fTime = document.getElementById('f-time');
  const saveFixtureDateTime = ()=>{
    saveMatchDetailField(f=>{
      const dateVal = fDate ? fDate.value : '';
      const timeVal = fTime ? fTime.value : '';
      f.dateTime = dateVal ? `${dateVal}T${timeVal || '00:00'}` : '';
    });
  };
  if(fDate) fDate.addEventListener('change', saveFixtureDateTime);
  if(fTime) fTime.addEventListener('change', saveFixtureDateTime);
  const fComp = document.getElementById('f-comp');
  if(fComp) fComp.addEventListener('change', ()=> saveMatchDetailField(f=>{ f.competitionType = fComp.value; }));
  const fReferee = document.getElementById('f-referee');
  if(fReferee) fReferee.addEventListener('change', ()=> saveMatchDetailField(f=>{ f.referee = fReferee.value; }));
  const fLocation = document.getElementById('f-location');
  if(fLocation) fLocation.addEventListener('change', ()=>{
    saveMatchDetailField(f=>{
      f.location = fLocation.value;
      findOrCreateLocation(f.location);
    });
    render();
  });
  document.querySelectorAll('[data-squad-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const f = getEditingFixture(VIEW.params.id);
      const pid = el.dataset.squadToggle;
      const cap = f.onField + f.bench;
      if(f.squadIds.includes(pid)){
        f.squadIds = f.squadIds.filter(id=>id!==pid);
      } else {
        if(f.squadIds.length >= cap){
          alert(`This match's squad is capped at ${cap} (${f.onField} on field + ${f.bench} bench). Remove someone first, or adjust the match format in the Team tab.`);
          return;
        }
        f.squadIds.push(pid);
      }
      saveData();
      render();
    });
  });
  document.querySelectorAll('[data-squad-filter]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      squadFilterMode = btn.dataset.squadFilter;
      render();
    });
  });
  function visibleSquadPlayers(){
    const label = currentSeasonLabel();
    return DATA.players.filter(p=>{
      if(squadFilterMode==='registered') return (p.registeredSeasons||[]).includes(label);
      if(squadFilterMode==='unregistered') return !(p.registeredSeasons||[]).includes(label);
      return true;
    });
  }
  const squadSelectAllBtn = document.querySelector('[data-squad-select-all]');
  if(squadSelectAllBtn) squadSelectAllBtn.addEventListener('click', ()=>{
    const f = getEditingFixture(VIEW.params.id);
    const cap = f.onField + f.bench;
    let added = 0, skipped = 0;
    visibleSquadPlayers().forEach(p=>{
      if(f.squadIds.includes(p.id)) return;
      if(f.squadIds.length >= cap){ skipped++; return; }
      f.squadIds.push(p.id);
      added++;
    });
    if(skipped>0) alert(`Added ${added} player${added===1?'':'s'} — ${skipped} more couldn't fit within this match's squad cap of ${cap}.`);
    saveData();
    render();
  });
  const squadClearAllBtn = document.querySelector('[data-squad-clear-all]');
  if(squadClearAllBtn) squadClearAllBtn.addEventListener('click', ()=>{
    const f = getEditingFixture(VIEW.params.id);
    const visibleIds = new Set(visibleSquadPlayers().map(p=>p.id));
    f.squadIds = f.squadIds.filter(id=>!visibleIds.has(id));
    saveData();
    render();
  });
  document.querySelectorAll('[data-lineup]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const f = getEditingFixture(VIEW.params.id);
      const [q,seg,pos] = el.dataset.lineup.split('|');
      const newVal = el.value;

      if(!f.lineup[q][pos]) f.lineup[q][pos] = {a:'', b:''};

      if(newVal){
        const existingSlot = findPlayerSlotInQuarter(f.lineup, f.positions, q, newVal);
        if(existingSlot && !(existingSlot.pos===pos && existingSlot.seg===seg)){
          const displaced = f.lineup[q][pos][seg];
          const simulated = JSON.parse(JSON.stringify(f.lineup[q]));
          if(!simulated[pos]) simulated[pos] = {a:'',b:''};
          if(!simulated[existingSlot.pos]) simulated[existingSlot.pos] = {a:'',b:''};
          simulated[pos][seg] = newVal;
          simulated[existingSlot.pos][existingSlot.seg] = displaced;
          let projectedSubs = 0;
          f.positions.forEach(p2=>{
            const s = simulated[p2] || {a:'',b:''};
            if(s.b && s.b !== s.a) projectedSubs++;
          });
          if(projectedSubs > f.bench){
            alert(`Only ${f.bench} substitute${f.bench===1?'':'s'} are allowed per quarter (based on this match's bench size). This swap would exceed that — remove another substitution first.`);
            render();
            return;
          }
          f.lineup[q][pos][seg] = newVal;
          f.lineup[q][existingSlot.pos][existingSlot.seg] = displaced;
          [{p:pos,s:seg},{p:existingSlot.pos,s:existingSlot.seg}].forEach(({p:p2,s:s2})=>{
            const slotObj = f.lineup[q][p2];
            if(s2==='a' && slotObj.b === slotObj.a){ slotObj.b=''; slotObj.subAt=null; }
            if(s2==='b' && !slotObj.b){ slotObj.subAt=null; }
          });
          saveData();
          render();
          return;
        }
      }

      if(newVal && playerAssignedElsewhere(f,q,seg,pos,newVal)){
        alert('That player is already assigned to another position for this segment.');
        render();
        return;
      }

      if(seg==='b' && newVal){
        const prevA = f.lineup[q][pos].a;
        const wasSub = f.lineup[q][pos].b && f.lineup[q][pos].b !== prevA;
        const willBeSub = newVal !== prevA;
        const currentSubs = subsUsedInQuarter(f,q);
        const projected = currentSubs - (wasSub?1:0) + (willBeSub?1:0);
        if(projected > f.bench){
          alert(`Only ${f.bench} substitute${f.bench===1?'':'s'} are allowed per quarter (based on this match's bench size). Remove another substitution first.`);
          render();
          return;
        }
      }

      f.lineup[q][pos][seg] = newVal;
      if(seg==='a' && f.lineup[q][pos].b === newVal){
        f.lineup[q][pos].b = '';
        f.lineup[q][pos].subAt = null;
      }
      if(seg==='b' && !newVal){
        f.lineup[q][pos].subAt = null;
      }
      saveData();
      render();
      if(seg==='b' && newVal){
        openSubAtModal('lineup', q, pos, f.lineup[q][pos].subAt, f.minutesPerPeriod);
      }
    });
  });
  document.querySelectorAll('[data-actual-lineup]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const f = DATA.fixtures.find(x=>x.id===VIEW.params.id);
      if(!f.actualLineup) f.actualLineup = JSON.parse(JSON.stringify(f.lineup));
      const [q,seg,pos] = el.dataset.actualLineup.split('|');
      const newVal = el.value;

      if(!f.actualLineup[q][pos]) f.actualLineup[q][pos] = {a:'', b:''};

      if(newVal){
        const existingSlot = findPlayerSlotInQuarter(f.actualLineup, f.positions, q, newVal);
        if(existingSlot && !(existingSlot.pos===pos && existingSlot.seg===seg)){
          const displaced = f.actualLineup[q][pos][seg];
          const simulated = JSON.parse(JSON.stringify(f.actualLineup[q]));
          if(!simulated[pos]) simulated[pos] = {a:'',b:''};
          if(!simulated[existingSlot.pos]) simulated[existingSlot.pos] = {a:'',b:''};
          simulated[pos][seg] = newVal;
          simulated[existingSlot.pos][existingSlot.seg] = displaced;
          let projectedSubs = 0;
          f.positions.forEach(p2=>{
            const s = simulated[p2] || {a:'',b:''};
            if(s.b && s.b !== s.a) projectedSubs++;
          });
          if(projectedSubs > f.bench){
            alert(`Only ${f.bench} substitute${f.bench===1?'':'s'} are allowed per quarter (based on this match's bench size). This swap would exceed that — remove another substitution first.`);
            render();
            return;
          }
          f.actualLineup[q][pos][seg] = newVal;
          f.actualLineup[q][existingSlot.pos][existingSlot.seg] = displaced;
          [{p:pos,s:seg},{p:existingSlot.pos,s:existingSlot.seg}].forEach(({p:p2,s:s2})=>{
            const slotObj = f.actualLineup[q][p2];
            if(s2==='a' && slotObj.b === slotObj.a){ slotObj.b=''; slotObj.subAt=null; }
            if(s2==='b' && !slotObj.b){ slotObj.subAt=null; }
          });
          saveData();
          render();
          return;
        }
      }

      if(newVal && assignedElsewhereIn(f.actualLineup, f.positions, q, seg, pos, newVal)){
        alert('That player is already assigned to another position for this segment.');
        render();
        return;
      }

      if(seg==='b' && newVal){
        const prevA = f.actualLineup[q][pos].a;
        const wasSub = f.actualLineup[q][pos].b && f.actualLineup[q][pos].b !== prevA;
        const willBeSub = newVal !== prevA;
        const currentSubs = subsUsedInLineup(f.actualLineup, f.positions, q);
        const projected = currentSubs - (wasSub?1:0) + (willBeSub?1:0);
        if(projected > f.bench){
          alert(`Only ${f.bench} substitute${f.bench===1?'':'s'} are allowed per quarter (based on this match's bench size). Remove another substitution first.`);
          render();
          return;
        }
      }

      f.actualLineup[q][pos][seg] = newVal;
      if(seg==='a' && f.actualLineup[q][pos].b === newVal){
        f.actualLineup[q][pos].b = '';
        f.actualLineup[q][pos].subAt = null;
      }
      if(seg==='b' && !newVal){
        f.actualLineup[q][pos].subAt = null;
      }
      saveData();
      render();
      if(seg==='b' && newVal){
        openSubAtModal('actual-lineup', q, pos, f.actualLineup[q][pos].subAt, f.minutesPerPeriod);
      }
    });

function attachModalHandlers(){

    if(!player){ alert('Select a taker'); return; }
    const outcome = document.getElementById('ev-pen-outcome').dataset.selected;
    f.events.push({id:uid(), type:'penalty', player, outcome, quarter:currentEventQuarter(f), loggedAt:new Date().toISOString()});
    if(outcome==='Scored') f.finalScore.us += 1;
    saveData(); closeModal(); render();
    if(outcome==='Scored') showGoalCelebration();
  };
  const confirmComment = document.querySelector('[data-confirm-comment]');
  if(confirmComment) confirmComment.onclick = ()=>{
    const f = DATA.fixtures.find(x=>x.id===confirmComment.dataset.confirmComment);
    f.quarterComments['q'+currentEventQuarter(f)] = document.getElementById('ev-comment').value;
    saveData(); closeModal(); render();
  };

}

function startTimer(fixtureId){
  stopTimer();
  timerInterval = setInterval(()=>{
    const f = DATA.fixtures.find(x=>x.id===fixtureId);
    if(!f || !f.liveState.running){ stopTimer(); return; }
    if(f.liveState.secondsLeft>0){
      f.liveState.secondsLeft--;
      const t = document.querySelector('.scoreboard .timer');
      if(t){ const m=Math.floor(f.liveState.secondsLeft/60), s=(f.liveState.secondsLeft%60).toString().padStart(2,'0'); t.textContent = `${m}:${s}`; }
      updateLiveMinutesTracker(f);
      if(f.liveState.secondsLeft % 10 === 0) saveData();
    } else {
      f.liveState.running = false;
      stopTimer();
      saveData();
      render();
    }
  }, 1000);
}
function updateLiveMinutesTracker(f){
  const total = totalMatchMinutes(f);
  document.querySelectorAll('[data-live-min-player]').forEach(row=>{
    const pid = row.dataset.liveMinPlayer;
    const {played, projected} = liveMinutesSplit(f, pid);
    const playedPct = Math.min(100, (played/total)*100);
    const projPct = Math.min(100-playedPct, (projected/total)*100);
    const playedEl = row.querySelector('[data-bar="played"]');
    const projEl = row.querySelector('[data-bar="projected"]');
    if(playedEl){
      playedEl.style.width = playedPct + '%';
      playedEl.innerHTML = played>0 ? `<span class="live-bar-val" data-bar="played-val">${Math.round(played)}'</span>` : '';
    }
    if(projEl){
      projEl.style.left = playedPct + '%';
      projEl.style.width = projPct + '%';
      projEl.innerHTML = projected>0 ? `<span class="live-bar-val" data-bar="proj-val">${Math.round(projected)}'</span>` : '';
    }
  });
}
function stopTimer(){ clearInterval(timerInterval); timerInterval = null; }

// Swipe right from the left edge to go back, mirroring iOS's edge-swipe gesture.
// Reuses whatever .backbar is currently on screen rather than tracking its own
// navigation stack, so it automatically stays correct as screens change.
(function setupSwipeBack(){
  let touchStartX = 0, touchStartY = 0, tracking = false;
  const EDGE_ZONE = 24;      // must start within this many px of the left edge
  const SWIPE_DISTANCE = 70; // minimum horizontal travel to count as a swipe
  const MAX_VERTICAL = 60;   // keeps this from firing during a vertical scroll

  document.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1){ tracking = false; return; }
    const t = e.touches[0];
    tracking = t.clientX <= EDGE_ZONE;
    if(tracking){ touchStartX = t.clientX; touchStartY = t.clientY; }
  }, {passive:true});

  document.addEventListener('touchend', (e)=>{
    if(!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = Math.abs(t.clientY - touchStartY);
    if(dx > SWIPE_DISTANCE && dy < MAX_VERTICAL){
      if(document.getElementById('modal-root')) return; // a modal is open - let it be closed its own way
      const backEl = document.querySelector('.backbar');
      if(backEl) backEl.click();
    }
  }, {passive:true});
})();

async function initApp(){
  if(LOGIN_DISABLED_FOR_TESTING){
    await loadData();
    return;
  }
  if(!supabaseClient){
    // Supabase script didn't load (e.g. no connection) - fall back to local-only mode
    // rather than locking the person out of an app they may have already been using.
    await loadData();
    return;
  }
  try{
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(session && session.user){
      currentUser = session.user;
      await loadData();
      await loadTeamsFromCloud();
    } else {
      renderAuthGate();
    }
  }catch(e){
    await loadData();
  }
}
initApp();
