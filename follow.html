<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Live match</title>
<style>
  :root{ --bg:#f4f5f7; --card:#fff; --ink:#14181f; --soft:#667085; --line:#e3e6ec; --accent:#0a7d3e; --live:#d92d20; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0d0f13; --card:#1a1d23; --ink:#f2f4f7; --soft:#9aa3b2; --line:#2a2e36; } }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .bgbadge{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .bgbadge img{ width:100%; height:100%; display:block; object-fit:cover; object-position:center; opacity:.25; }
  @media (prefers-color-scheme: dark){ .bgbadge img{ opacity:.18; } }
  .wrap{ position:relative; z-index:1; max-width:520px; margin:0 auto; padding:18px 16px calc(28px + env(safe-area-inset-bottom)); }
  h1{ font-size:20px; margin:4px 0 2px; }
  .sub{ color:var(--soft); font-size:13.5px; margin-bottom:16px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; letter-spacing:.06em; padding:4px 10px; border-radius:999px; background:var(--live); color:#fff; }
  .chip.ft{ background:var(--soft); }
  .chip .dot{ width:7px; height:7px; border-radius:50%; background:#fff; animation:pulse 1.4s infinite; }
  .chip.ft .dot{ display:none; }
  @keyframes pulse{ 50%{ opacity:.25; } }
  .board{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; text-align:center; margin:14px 0 6px; }
  .tn{ font-weight:700; font-size:15px; overflow-wrap:anywhere; }
  .sc{ font-size:40px; font-weight:800; letter-spacing:.02em; white-space:nowrap; }
  .clock{ text-align:center; color:var(--soft); font-size:14px; font-variant-numeric:tabular-nums; }
  .tl-title{ font-size:12px; font-weight:800; letter-spacing:.08em; color:var(--soft); margin:16px 0 4px; text-transform:uppercase; }
  .ev{ display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); font-size:15px; }
  .ev:first-of-type{ border-top:2px solid var(--accent); }
  .ev .ic{ width:24px; text-align:center; flex-shrink:0; }
  .ev .meta{ color:var(--soft); font-size:12.5px; margin-top:2px; }
  .ev.sub{ color:var(--soft); font-size:14px; }
  .empty{ color:var(--soft); font-size:14px; padding:6px 0; }
  details.hist{ padding:12px 16px; }
  details.hist summary{ cursor:pointer; list-style:none; display:flex; gap:12px; align-items:center; font-size:14.5px; }
  details.hist summary::-webkit-details-marker{ display:none; }
  .hd{ color:var(--soft); font-size:12.5px; font-weight:700; min-width:48px; }
  .hm{ flex:1; min-width:0; overflow-wrap:anywhere; }
  .hist .ev:first-of-type{ margin-top:8px; }
  .btn{ display:block; width:100%; border:none; border-radius:12px; padding:13px; font-size:15.5px; font-weight:700; background:var(--accent); color:#fff; cursor:pointer; }
  .btn.ghost{ background:transparent; border:1.5px solid var(--line); color:var(--ink); }
  .note{ color:var(--soft); font-size:13px; margin-top:10px; line-height:1.45; }
  .big{ text-align:center; padding:26px 10px; }
  .big .t{ font-size:17px; font-weight:700; margin-bottom:6px; }
</style>
</head>
<body>
<div class="bgbadge" id="bgbadge"></div>
<div class="wrap" id="app"><div class="empty">Loading...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://lldsezmzjprdbeqneynf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OiyifaZ7_9Ca3WIk5lYR_w_Y0A7SY9e';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let state = {data:null, fetchedAt:0, error:'', notif:'unknown', msg:'', busy:false};

const esc = (s)=> String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = {goal:'⚽', ogoal:'⚽', yc:'🟨', rc:'🟥', pen:'🥅', sub:'⇄'};

// ---- reading the live match ----
async function load(){
  if(!sb || !TOKEN){ state.error = 'This link is not complete. Please ask the coach to share it again.'; paint(); return; }
  try{
    const {data, error} = await sb.rpc('follow_get', {p_token:TOKEN});
    if(error) throw error;
    if(data === null){ state.error = 'This link is no longer active. Please ask the coach for the new one.'; state.data = null; }
    else { state.error = ''; state.data = data; state.fetchedAt = Date.now(); }
  }catch(e){ if(!state.data) state.error = "Couldn't load the match. Check your connection."; }
  paint();
}
function remaining(m){
  const c = m.snapshot.clock || {};
  if(!c.running) return Math.max(0, c.secondsLeft || 0);
  const age = (Date.parse(state.data.now) - Date.parse(m.updated_at)) / 1000;
  return Math.max(0, Math.round((c.secondsLeft || 0) - age - (Date.now() - state.fetchedAt) / 1000));
}
function mmss(s){ return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

function clockText(m){
  const s = m.snapshot;
  if(s.brk) return (s.period || 'Break') + ' - Break';
  return (s.period || '') + ' · ' + mmss(remaining(m)) + ' left';
}
function matchHtml(m){
  const s = m.snapshot, ft = m.ended || s.status === 'ft';
  if(s.accent) document.documentElement.style.setProperty('--accent', s.accent);
  const evs = (s.events || []).slice().reverse();
  return `<div class="card" data-m="${esc(m.fixture_id)}">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="chip ${ft?'ft':''}"><span class="dot"></span>${ft?'FULL TIME':'LIVE'}</span>
      <span class="clock" data-clock="${esc(m.fixture_id)}">${ft ? '' : esc(clockText(m))}</span>
    </div>
    <div class="board">
      <div class="tn">${esc(s.home)}</div>
      <div class="sc">${esc(s.hs)}&nbsp;-&nbsp;${esc(s.as)}</div>
      <div class="tn">${esc(s.away)}</div>
    </div>
    <div class="tl-title">Timeline</div>
    ${evs.length ? evs.map(e=>`<div class="ev ${e.k==='sub'?'sub':''}"><div class="ic">${ICON[e.k]||''}</div><div><div>${esc(e.txt)}</div><div class="meta">${esc(e.per||'')}${e.clk?' · '+esc(e.clk):''}</div></div></div>`).join('')
      : `<div class="empty">No goals or cards yet.</div>`}
  </div>`;
}

function histHtml(m){
  const s = m.snapshot, evs = (s.events || []).slice().reverse();
  let d = ''; try{ if(s.dt) d = new Date(s.dt).toLocaleDateString(undefined, {day:'numeric', month:'short'}); }catch(e){}
  return `<details class="card hist"><summary><span class="hd">${esc(d)}</span><span class="hm"><span class="tn2">${esc(s.home)}</span> <b>${esc(s.hs)}&nbsp;-&nbsp;${esc(s.as)}</b> <span class="tn2">${esc(s.away)}</span></span></summary>
    ${evs.length ? evs.map(e=>`<div class="ev ${e.k==='sub'?'sub':''}"><div class="ic">${ICON[e.k]||''}</div><div><div>${esc(e.txt)}</div><div class="meta">${esc(e.per||'')}${e.clk?' · '+esc(e.clk):''}</div></div></div>`).join('') : `<div class="empty">No goals or cards.</div>`}
  </details>`;
}
function notifHtml(){
  const supported = ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
  if(!supported) return `<div class="note">To get notifications on an iPhone, add this page to your Home Screen first (Share &rarr; Add to Home Screen), then open it from there.</div>`;
  if(Notification.permission === 'denied') return `<div class="note">Notifications are blocked for this site. You can allow them in your phone's browser settings.</div>`;
  if(state.notif === 'on') return `<button class="btn ghost" data-off>Notifications are on &middot; turn off</button><div class="note">${esc(state.msg || "You'll be told about kick-off, goals and full time.")}</div>`;
  return `<button class="btn" data-on ${state.busy?'disabled':''}>Notify me about this match</button><div class="note">${esc(state.msg || "Get kick-off, goals and full-time alerts on this phone.")}</div>`;
}

function paint(){
  const app = document.getElementById('app');
  const d = state.data;
  if(state.error && !d){ app.innerHTML = `<div class="card big"><div class="t">Live match</div><div class="empty">${esc(state.error)}</div></div>`; return; }
  const matches = (d && d.matches) || [], hist = (d && d.history) || [];
  const bg = document.getElementById('bgbadge'), bsrc = [d && d.badge].concat(matches.map(m=>m.snapshot && m.snapshot.badge)).find(b=>typeof b==='string' && /^data:image\/(?:png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(b));
  if(bg) bg.innerHTML = bsrc ? `<img src="${bsrc}" alt="">` : '';
  app.innerHTML = `<h1>${esc((d && d.team) || 'Live match')}</h1><div class="sub">Live match updates &middot; refreshes automatically</div>
    ${matches.length ? matches.map(matchHtml).join('') : `<div class="card big"><div class="t">No match is live right now</div><div class="empty">When a match kicks off, the score and timeline appear here.</div></div>`}
    ${hist.length ? `<div class="tl-title">Season so far</div>${hist.map(histHtml).join('')}` : ''}
    <div class="card">${notifHtml()}</div>`;
  const on = app.querySelector('[data-on]'), off = app.querySelector('[data-off]');
  if(on) on.onclick = enableNotifs;
  if(off) off.onclick = disableNotifs;
}
// keep the clock ticking between refreshes without redrawing the page
setInterval(()=>{
  if(!state.data) return;
  (state.data.matches || []).forEach(m=>{
    if(m.ended || (m.snapshot && m.snapshot.status === 'ft')) return;
    const el = document.querySelector(`[data-clock="${CSS.escape(m.fixture_id)}"]`);
    if(el) el.textContent = clockText(m);
  });
}, 1000);
setInterval(()=>{ if(!document.hidden) load(); }, 5000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(); });

// ---- notifications ----
function u8(b64){ const p = '='.repeat((4 - b64.length % 4) % 4), s = (b64 + p).replace(/-/g,'+').replace(/_/g,'/'), r = atob(s), a = new Uint8Array(r.length); for(let i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return a; }
function saveToken(v){
  return new Promise((res)=>{
    try{
      const r = indexedDB.open('sqh-follow', 1);
      r.onupgradeneeded = ()=> r.result.createObjectStore('kv');
      r.onsuccess = ()=>{
        try{
          const tx = r.result.transaction('kv', 'readwrite'), os = tx.objectStore('kv');
          if(v) os.put(v, 'token'); else os.delete('token');
          tx.oncomplete = ()=> res(true); tx.onerror = ()=> res(false);
        }catch(e){ res(false); }
      };
      r.onerror = ()=> res(false);
    }catch(e){ res(false); }
  });
}
async function registration(){
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  return reg;
}
async function subscribeNow(reg){
  const {data: key, error} = await sb.rpc('follow_vapid');
  if(error || !key) throw new Error('Notifications are not set up yet.');
  const wanted = u8(key);
  let sub = await reg.pushManager.getSubscription();
  if(sub){
    const cur = sub.options && sub.options.applicationServerKey ? new Uint8Array(sub.options.applicationServerKey) : null;
    if(!cur || cur.length !== wanted.length || cur.some((v,i)=>v!==wanted[i])){ await sub.unsubscribe(); sub = null; }
  }
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:wanted});
  const j = sub.toJSON();
  const {data: ok, error: e2} = await sb.rpc('follow_subscribe', {p_token:TOKEN, p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_user_agent:navigator.userAgent});
  if(e2 || !ok) throw new Error('This link is no longer active.');
  await saveToken(TOKEN);
  return sub;
}
async function enableNotifs(){
  state.busy = true; state.msg = 'Turning on...'; paint();
  try{
    const perm = Notification.permission === 'default' ? await Notification.requestPermission() : Notification.permission;
    if(perm !== 'granted') throw new Error('Notifications were not allowed.');
    await subscribeNow(await registration());
    state.notif = 'on'; state.msg = '';
  }catch(e){ state.msg = e.message || String(e); }
  state.busy = false; paint();
}
async function disableNotifs(){
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if(sub){ await sb.rpc('follow_unsubscribe', {p_token:TOKEN, p_endpoint:sub.endpoint}); await sub.unsubscribe(); }
    await saveToken(null);
  }catch(e){}
  state.notif = 'off'; state.msg = ''; paint();
}
async function initNotifs(){
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window) || Notification.permission !== 'granted') return;
    const reg = await registration();
    const sub = await reg.pushManager.getSubscription();
    if(sub){ await subscribeNow(reg); state.notif = 'on'; paint(); }     // also refreshes the server's copy of this phone
  }catch(e){}
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', (e)=>{ const t = e.data && e.data.type; if(t === 'push' || t === 'refresh') load(); });
}
load();
initNotifs();
</script>
</body>
</html>
